<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Chengdu · Jan 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B5E8C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Chengdu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F2;--card:#FFF;--ink:#1C2228;--mute:#68717A;--line:#E3E6E1;--accent:#2B5E8C;--accent-soft:#E2ECF5;--pepper:#C8412B;--pepper-soft:#FBE9E5;--amber:#B7791F;--amber-soft:#FBF1DF;--green:#2E9A6A;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 4px) 16px 100px}
header.top{padding:14px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;font-size:12px;color:var(--mute)}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.lang{display:flex;background:var(--line);border-radius:99px;padding:3px;flex:none}
.lang button{border:none;background:none;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
section.view{display:none}section.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:700;margin-bottom:8px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.muted{color:var(--mute);font-size:13px}
.hero{background:linear-gradient(135deg,#2B5E8C,#3E7FAF);color:#fff;border:none}
.hero .big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero .muted{color:rgba(255,255,255,.8)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px;min-width:0}
.stats b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11px;color:rgba(255,255,255,.8)}
.mapcard{padding:8px}
.mapwrap svg{width:100%;height:auto;display:block;border-radius:12px}
.mapwrap .route{transition:opacity .25s}
.mapwrap.dim .route{opacity:.12}.mapwrap.dim .route.on{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dl{display:flex;gap:8px;margin-top:8px}
.btn{border:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#25D366}
.remind{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.remind:first-child{border-top:none;padding-top:0}
.remind .ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--accent-soft)}
.remind p{font-size:13.5px}
.leg{padding:10px 0;border-top:1px dashed var(--line)}.leg:first-child{border-top:none;padding-top:0}
.leg .dt{font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
.leg .g{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.leg .code{font-size:20px;font-weight:800}.leg .t{font-size:13px;color:var(--mute)}
.leg .mid{text-align:center;font-size:11px;color:var(--mute);min-width:90px}.leg .mid i{display:block;height:1px;background:var(--line);margin:4px 0}
.leg .r{text-align:right}
.transit{font-size:12px;background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:8px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daychip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;min-width:62px}
.daychip small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.daychip b{font-size:16px}
.daychip.on{background:var(--ink);border-color:var(--ink);color:#fff}.daychip.on small{color:rgba(255,255,255,.7)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:4px 2px 12px}
.dayhead h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.pace{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pace.moderate{background:var(--amber-soft);color:var(--amber)}.pace.busy{background:var(--pepper-soft);color:var(--pepper)}
.minimap{border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.stop{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.stop:before{content:"";position:absolute;left:-17px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.stop.opt:before{border-color:var(--amber)}
.stop .time{font-size:12px;font-weight:700;color:var(--accent)}.stop.opt .time{color:var(--amber)}
.stop h3{font-size:14.5px;font-weight:700;margin:1px 0 2px}
.stop p{font-size:13px;color:var(--mute)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
a.chip{font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;text-decoration:none;color:var(--accent);background:var(--accent-soft)}
.move{font-size:12px;color:var(--mute);margin:-2px 0 8px 2px}
.optlabel{font-size:12.5px;font-weight:800;color:var(--ink);margin:10px 0 8px 2px}
.crow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.crow:first-of-type{border-top:none}
.crow b{white-space:nowrap}
.ctot{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:10px;border-top:2px solid var(--ink)}
.ctot b{font-size:22px;font-weight:800}
.bars{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:12px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.leave{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.leave div{text-align:center;border-radius:10px;padding:6px 0;background:var(--bg);font-size:11px;color:var(--mute)}
.leave div b{display:block;font-size:15px;color:var(--ink)}
.leave .al{background:var(--accent);color:#fff}.leave .al b{color:#fff}
.leave .half{background:linear-gradient(180deg,var(--accent) 55%,var(--accent-soft) 55%);color:var(--accent);font-weight:700}.leave .half b{color:#fff}
.altag{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:99px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:2px}
.budget{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.budget div{background:var(--bg);border-radius:10px;padding:10px}
.budget span{display:block;font-size:11.5px;color:var(--mute)}.budget b{font-size:17px}
.budget input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;font-size:16px;background:#fff;margin-top:2px}
.left{margin-top:10px;padding:12px;border-radius:12px;background:var(--accent-soft)}.left.neg{background:var(--pepper-soft)}
.left b{font-size:22px}
.ck{font-size:13.5px;display:flex;gap:8px;align-items:center;margin-top:10px}
.prog{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800}
.prog b{font-size:18px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.cat{margin-bottom:12px}
.cat .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 6px}
.cat .ch b{font-size:13px;font-weight:700}.cat .ch span{font-size:12px;color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.cb{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #C3C8C2;display:grid;place-items:center;cursor:pointer;background:#fff}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .nm{flex:1;font-size:14px;cursor:pointer}
.item.done .nm{color:var(--mute);text-decoration:line-through}
.x{flex:none;border:none;background:none;color:#B3B8B2;font-size:18px;cursor:pointer;width:24px}
.add{display:flex;gap:6px;margin-top:8px}
.add input,.add select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);min-width:0}
.add input{flex:1}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.appi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.appi:first-child{border-top:none;padding-top:2px}
.appi .lg{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff}
.appi h3{font-size:14.5px;font-weight:700}.appi p{font-size:13px;color:var(--mute)}
.appi a{font-size:12.5px;font-weight:600;text-decoration:none}
.sync{font-size:12px;color:var(--mute);margin:-6px 2px 12px}.sync.ok{color:var(--green)}.sync.bad{color:var(--pepper)}
.toolbar{display:flex;justify-content:flex-end;margin:-4px 0 10px}
.ebtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.ebtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctl{display:flex;gap:4px;margin-top:8px}
.move .ctl,.optlabel .ctl,.cr .ctl{margin-top:0}
.ctl button{border:1px solid var(--line);background:var(--bg);min-width:30px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mute);padding:0 6px}
button.arm{background:var(--pepper)!important;border-color:var(--pepper)!important;color:#fff!important;font-weight:700}
.move,.optlabel{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cr{display:flex;align-items:center;gap:8px}
.remind .bd{flex:1;min-width:0}
.tl.em .stop{border-style:dashed}
form.edit{margin:6px 0}
form.edit input,form.edit textarea,form.edit select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fff;font-size:14px}
form.edit .fl{font-size:11px;font-weight:700;color:var(--mute);margin:2px 0 3px;display:block}
form.edit .ck input{width:auto;margin:0}
.frow{display:flex;gap:6px}.frow>*{flex:1;min-width:0}
.addbtn{border:1px dashed #C3C8C2;background:none;border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px;cursor:pointer;color:var(--accent);width:100%;margin-top:8px}
.addrow{display:flex;gap:6px}.addrow .addbtn{flex:1}
.linkb{border:none;background:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;margin:-6px 2px 10px;padding:0;display:inline-block;text-decoration:none}
.exph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.exp{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.exp .exph span{font-size:12.5px;color:var(--mute)}
.hal{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.hal:first-child{border-top:none;padding-top:0}
.hal .hi{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#E6F4EC;font-size:15px}
.hal.none .hi{background:var(--amber-soft)}.hal .bd{flex:1;min-width:0}.hal h3{font-size:14.5px;font-weight:700}.hal p{font-size:13px;color:var(--mute)}
.tipcard{background:var(--accent-soft);border-color:transparent;font-size:13px}
.err{color:var(--pepper);font-size:13px;margin-top:6px;min-height:1em}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
</style>
</head>

    etag=r.headers.get("ETag")||"";store.set("sc-etag",etag);lastSync=Date.now();store.set("sc-synced",lastSync);
    if(saving)return;applyData(d);setSync("ok");
  }catch(e){
    if(!T){try{const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});if(r.ok){applyData(await r.json());setSync("ok");return}}catch(x){}}
    setSync(T?"err":"loading");
  }
}
/* commit(mut): apply mut to local data now, then to the freshest remote copy and push it */
let commitQ=Promise.resolve();
function commit(mut,msg){
  mut(T);store.set("sc-data",T);renderAll();
  if(!token)return;
  saving++;setSync("saving");
  commitQ=commitQ.then(async()=>{
    for(let attempt=0;attempt<3;attempt++){
      const g=await fetch(API+"?ref="+REPO.branch+"&t="+Date.now(),{headers:ghHeaders(true),cache:"no-store"});
      if(!g.ok)throw new Error("HTTP "+g.status);
      const j=await g.json();const remote=JSON.parse(b64dec(j.content));mut(remote);
      const p=await fetch(API,{method:"PUT",headers:{...ghHeaders(true),"Content-Type":"application/json"},body:JSON.stringify({message:msg||"Update trip via app",content:b64enc(JSON.stringify(remote,null,2)+"\n"),sha:j.sha,branch:REPO.branch})});
      if(p.status===409||p.status===422){continue}
      if(!p.ok)throw new Error(p.status===401||p.status===403?"token":"HTTP "+p.status);
      etag="";store.set("sc-etag","");T=remote;store.set("sc-data",T);return;
    }
    throw new Error("conflict");
  }).then(()=>{saving--;setSync("saved");if(!editing)renderAll()},e=>{saving--;setSync("fail:"+e.message)});
}

    <div class="muted" style="text-align:right">${esc(t("buffer"))}: ~RM${Math.ceil(tot*1.05/10)*10}</div>
    <div class="bars"><i style="width:${pct(tr)};background:#2B5E8C"></i><i style="width:${pct(ho)};background:#E8912D"></i><i style="width:${pct(fe)};background:#2E9A6A"></i></div>
    <div class="legend"><span><i style="background:#2B5E8C"></i>${esc(t("transport"))} RM${tr}</span><span><i style="background:#E8912D"></i>${esc(t("hotel"))} RM${ho}</span><span><i style="background:#2E9A6A"></i>${esc(t("fees"))} RM${fe}</span></div>
    <label class="ck"><input type="checkbox" id="stu"${student?" checked":""}> ${esc(t("student"))}</label></div>
    ${grp("transport","transport")}${grp("hotel","hotel")}${grp("fees","fees")}
    <p class="muted" style="padding:0 2px">${esc(tx(c.notIncluded))}</p>`;
  const fi=$("#flIn");if(fi)fi.onchange=e=>{store.set("sc-flight",Math.max(0,Number(e.target.value)||0));renderCost()};
  $("#stu").onchange=e=>{student=e.target.checked;store.set("sc-student",student);renderCost()};
}

/* ===== expenses (Google Sheet) ===== */
let exp=store.get("sc-exp",null),expState="",expAt=store.get("sc-exp-at",0),expUrlLoaded="";
const sheetId=u=>{const m=String(u||"").match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:""};
function parseCSV(txt){const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}return rows}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
/* find every "Date | Item | Rm" header block and read rows under it */
function readTables(rows){const out=[];
  rows.forEach((r,ri)=>r.forEach((c,ci)=>{
    if(/^date$/i.test(c.trim())&&/^item$/i.test((r[ci+1]||"").trim())&&/^rm$/i.test((r[ci+2]||"").trim())){
      let title="";for(let k=ri-1;k>=0&&!title;k--){const above=rows[k];title=[above[ci],above[ci+1],above[ci+2]].map(x=>(x||"").trim()).filter(Boolean).join(" ")}
      const items=[];for(let k=ri+1;k<rows.length;k++){const x=rows[k];const dt=(x[ci]||"").trim(),it=(x[ci+1]||"").trim(),rm=(x[ci+2]||"").trim();
        if(/^date$/i.test(dt))break;if(!dt&&!it&&!rm)continue;if(/^(total|jumlah)/i.test(dt)||/^(total|jumlah)/i.test(it))continue;items.push({dt,it,rm:num(rm)})}
      out.push({title,items})}}));
  return out}
async function loadExp(force){
  const u=T&&T.expenses&&T.expenses.url,id=sheetId(u);if(!id)return;
  if(!force&&expUrlLoaded===u&&Date.now()-expAt<60000)return;expUrlLoaded=u;
  if(!exp){expState="loading";renderCostSoon()}
  try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&t=${Date.now()}`,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);const txt=await r.text();if(/^\s*</.test(txt))throw new Error("html");
    exp={url:u,tables:readTables(parseCSV(txt))};expAt=Date.now();store.set("sc-exp",exp);store.set("sc-exp-at",expAt);expState="ok"}
  catch(e){expState=exp?"stale":"fail"}
  renderCostSoon()}
let rcT=null;const renderCostSoon=()=>{clearTimeout(rcT);rcT=setTimeout(()=>{if(!editing)renderCost()},50)};
function expHTML(){
  const E=T.expenses;if(!E||!E.url)return"";const ok=okUrl(E.url);
  const ago=expAt?Math.max(0,Math.round((Date.now()-expAt)/60000)):null;
  let body="";
  if(exp&&exp.url===E.url&&exp.tables.length){body=exp.tables.map((tb,i)=>{const tot=tb.items.reduce((s,x)=>s+x.rm,0);
    return `<div class="exp"><div class="exph"><b>${esc(tb.title||t("expTable")+" "+(i+1))}</b><span>${esc(t("expTotal"))} <b>RM${tot.toLocaleString("en",{maximumFractionDigits:2})}</b></span></div>${tb.items.length?tb.items.map(x=>`<div class="crow"><span><span class="muted">${esc(x.dt)}</span> ${esc(x.it)}</span><b>RM${x.rm.toLocaleString("en",{maximumFractionDigits:2})}</b></div>`).join(""):`<p class="muted">${esc(t("expEmpty"))}</p>`}</div>`}).join("");
    body+=`<p class="muted" style="font-size:11.5px;margin-top:6px">${esc(t("expUpdated",{t:ago==null?"":ago<1?t("justNow"):t("minAgo",{n:ago})}))}</p>`}
  else body=`<p class="muted">${esc(expState==="fail"?t("expFail"):t("expLoading"))}</p>`;
  return `<div class="label">${esc(t("expTitle"))}</div><div class="card"><div class="exph"><div><b>📊 ${esc(E.title||"Expenses Tracker")}</b>${E.by?`<div class="muted" style="font-size:12px">${esc(t("expBy",{by:E.by}))}</div>`:""}</div>${ok?`<a class="btn ghost" href="${esc(E.url)}" target="_blank" rel="noopener" style="padding:6px 10px;font-size:12.5px">${esc(t("expOpen"))}</a>`:""}</div>${body}</div>`;
}

/* ===== packing (local per phone) ===== */
let bag=store.get("sc-bag",null);
const CATS=()=>Object.keys(T.packing);
const defBag=()=>{const a=[];CATS().forEach(c=>T.packing[c].forEach(([ms,en])=>a.push({id:uid(),c,n:{ms,en},d:false})));return a};
function saveBag(){store.set("sc-bag",bag);renderBag()}
function renderBag(){
  if(!bag){bag=defBag();store.set("sc-bag",bag)}
  const done=bag.filter(i=>i.d).length,tot=bag.length,pct=tot?Math.round(done/tot*100):0;
  $("#progTxt").textContent=`${done} / ${tot}`;$("#progBar").style.width=pct+"%";$("#ring").style.setProperty("--p",pct);$("#ringTxt").textContent=pct+"%";
  $("#packCats").innerHTML=CATS().filter(c=>bag.some(i=>i.c===c)).map(c=>{const it=bag.filter(i=>i.c===c);return `<div class="cat"><div class="ch"><b>${esc(t("bc_"+c))}</b><span>${it.filter(i=>i.d).length}/${it.length}</span></div><div class="list">${it.map(i=>`<div class="item${i.d?" done":""}" data-id="${i.id}"><span class="cb${i.d?" on":""}" data-p="tog"></span><span class="nm" data-p="tog">${esc(tx(i.n))}</span><button class="x" type="button" data-p="del" aria-label="Remove">×</button></div>`).join("")}</div></div>`}).join("");
  const left=bag.filter(i=>!i.d).map(i=>"• "+tx(i.n));
  $("#waShare").href="https://wa.me/?text="+encodeURIComponent(`${t("waHead")} (${done}/${tot}) ✅\n\n${t("waLeft")}:\n${left.join("\n")||"-"}`);
  const sel=$("#addCat"),v=sel.value;sel.innerHTML=CATS().map(c=>`<option value="${c}">${esc(t("bc_"+c))}</option>`).join("");if(v)sel.value=v;
}
$("#packCats").onclick=e=>{const a=e.target.closest("[data-p]");if(!a)return;const id=a.closest(".item").dataset.id;if(a.dataset.p==="tog"){const i=bag.find(x=>x.id===id);if(i)i.d=!i.d}else bag=bag.filter(x=>x.id!==id);saveBag()};
$("#addForm").onsubmit=e=>{e.preventDefault();const n=$("#addName").value.trim();if(!n)return;bag.push({id:uid(),c:$("#addCat").value,n,d:false});$("#addName").value="";saveBag()};
$("#resetBtn").onclick=e=>{const b=e.currentTarget;if(b.dataset.arm){bag=defBag();saveBag();delete b.dataset.arm;b.textContent=t("reset");return}b.dataset.arm=1;b.textContent=t("confirm");setTimeout(()=>{delete b.dataset.arm;b.textContent=t("reset")},2500)};

/* ===== halal ===== */
let appArea="";
function halalItem(h){
  if(isEd("halal",h.id))return formHTML(SCHEMA.halal(),h,"list",` data-list="halal" data-id="${esc(h.id)}"`);
  const acts=[];if(h.map)acts.push(`<a class="chip" href="${esc(mapUrl(h.map,h.city))}" target="_blank" rel="noopener">${esc(t("map"))}</a>`);
  if(okUrl(h.src))acts.push(`<a class="chip" href="${esc(h.src)}" target="_blank" rel="noopener">${esc(t("src"))} ↗</a>`);
  const none=!h.map;
  return `<div class="hal${none?" none":""}"><div class="hi">${none?"⚠️":"🕌"}</div><div class="bd"><h3>${esc(h.name)}</h3><p>${esc(tx(h))}</p>${acts.length?`<div class="acts">${acts.join("")}</div>`:""}${ctl("halal",h.id)}</div></div>`}
function halalAreaHTML(area){const items=(T.halal||[]).filter(h=>h.area===area);return items.length?`<div class="label">${esc(t("area_"+area))}</div><div class="card">${items.map(halalItem).join("")}</div>`:""}

/* ===== apps + admin ===== */
const ACATS=["halal","hotels","food","maps","transport","essentials"];let appCat="halal";
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function renderApps(){
  $("#appSeg").innerHTML=ACATS.map(c=>`<button type="button" data-k="${c}" class="${c===appCat?"on":""}">${esc(t("cat_"+c))}</button>`).join("");
  if(appCat==="halal"){$("#appList").style.display="none";$("#halalBox").innerHTML=editBtn()+(T.halalTips?`<div class="card tipcard">💡 ${esc(tx(T.halalTips))}</div>`:"")+AREAS.map(halalAreaHTML).join("")+addBtn("halal");}
  else{$("#appList").style.display="";$("#halalBox").innerHTML=""}
  $("#appList").innerHTML=T.apps.filter(a=>a.cat===appCat).map(a=>`<div class="appi"><div class="lg" style="background:hsl(${hue(a.name)} 45% 42%)">${esc(a.name[0])}</div><div><h3>${esc(a.name)}</h3><p>${esc(tx(a))}</p><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))} ↗</a></div></div>`).join("");
  $("#adminCard").innerHTML=`<h2>${esc(t("adminTitle"))}</h2>`+(token?`<p class="muted">${esc(t("adminOn"))}</p><button class="btn ghost" type="button" id="tokOut" style="margin-top:10px">${esc(t("adminOut"))}</button>`
    :`<p class="muted">${esc(t("adminOff"))}</p><p class="muted" style="margin-top:6px;font-size:12px">${esc(t("adminSteps"))}</p><a class="linkb" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">${esc(t("makeToken"))}</a><form class="add" id="tokForm"><input id="tokIn" type="password" autocomplete="off" placeholder="${esc(t("tokenPh"))}"><button class="btn">${esc(t("tokenSave"))}</button></form><p class="err" id="tokErr"></p>`);
  const tf=$("#tokForm");if(tf)tf.onsubmit=async e=>{e.preventDefault();const v=$("#tokIn").value.trim();if(!v)return;
    try{const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+v}});const j=r.ok?await r.json():null;
      if(j&&j.permissions&&j.permissions.push){token=v;store.set("sc-token",v);editMode=true;renderAll();pull()}else $("#tokErr").textContent=t("tokenBad")}catch(x){$("#tokErr").textContent=t("tokenBad")}};
  const to=$("#tokOut");if(to)to.onclick=()=>{token="";store.del("sc-token");editMode=false;editing=null;renderAll()};
}
$("#appSeg").onclick=e=>{const b=e.target.closest("button");if(b){dropNew();editing=null;appCat=b.dataset.k;renderApps()}};
document.addEventListener("click",e=>{if(e.target.closest("[data-gohalal]")){appCat="halal";renderApps()}});

function renderAll(){if(!T)return;renderTop();renderChips();renderDays();renderCost();renderBag();renderApps();setSync(syncState||"syncing")}
$("#lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;L=b.dataset.l;store.set("sc-lang",L);renderAll()};
show(location.hash.slice(1));
if(T)renderAll();else setSync("loading");
pull();loadExp();
setInterval(()=>{if(document.visibilityState==="visible")loadExp()},60000);
setInterval(()=>{if(document.visibilityState==="visible"&&!editing)pull()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
setInterval(()=>{if(syncState==="ok")setSync("ok")},30000);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
