<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Chengdu · Jan 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F5E4B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Chengdu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#F3F6F4;--surface:#FFFFFF;--ink:#18282D;--mute:#5E6E70;--faint:#8A9896;--line:#DDE4E1;
  --pine:#1F5E4B;--pine-soft:#E3EEE9;--saffron:#E0A030;--saffron-soft:#FBF0DA;--chili:#B23A2A;--chili-soft:#F8E6E2;--glacier:#D3E3E9;
  --head:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--snow);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pine)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 20px 110px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0 4px}
.top .when{font-size:14px;color:var(--mute)}
.top h1{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.025em;font-variation-settings:"opsz" 96}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;margin-top:4px;background:var(--surface)}
.lang button{border:none;background:none;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:#fff}
.sync{font-size:13px;color:var(--faint);margin:2px 0 18px;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--pine)}.sync.bad{color:var(--chili)}.sync.bad i{background:var(--chili)}

/* type */
h2.sec{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:30px 0 10px;font-variation-settings:"opsz" 48}
h2.sec:first-child{margin-top:4px}
.sub{color:var(--mute);font-size:14px}
.small{font-size:13px;color:var(--mute)}
section.view{display:none}section.view.active{display:block}

/* altitude strip: the one loud thing */
.alt{background:var(--surface);border-radius:22px;padding:18px 16px 10px;border:1px solid var(--line)}
.alt .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.alt .count{font-family:var(--head);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em;font-variation-settings:"opsz" 96}
.alt .count small{font-size:16px;font-weight:600;letter-spacing:0;color:var(--mute);margin-left:6px}
.alt svg{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.alt .pt{cursor:pointer}
.alt .pt:focus-visible circle{stroke:var(--saffron);stroke-width:4}
.alt-note{font-size:12px;color:var(--faint);text-align:right;margin-top:2px}

/* next / quick links */
.next{margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.next a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.next b{display:block;font-family:var(--head);font-size:20px;font-weight:700;line-height:1.1}
.next span{font-size:13px;color:var(--mute)}
.upnext{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--pine);color:#fff}
.upnext .k{font-size:13px;opacity:.8}.upnext .v{font-family:var(--head);font-size:20px;font-weight:700;line-height:1.2;margin-top:2px}

/* plain lists */
.rows{border-top:1px solid var(--line)}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row p{font-size:15px}
.rem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.rem .n{font-family:var(--head);font-weight:700;color:var(--pine);font-size:15px;min-width:18px}

/* leave */
.leave{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.leave div{text-align:center;border-radius:10px;padding:7px 0 6px;font-size:12px;color:var(--mute);border:1px solid var(--line);background:var(--surface)}
.leave b{display:block;font-family:var(--head);font-size:17px;color:var(--ink);line-height:1.2}
.leave .al{background:var(--pine);border-color:var(--pine);color:#dfece6}.leave .al b{color:#fff}
.leave .half{background:var(--pine-soft);border:1.5px dashed var(--pine);color:var(--pine);font-weight:700}.leave .half b{color:var(--pine)}

/* map */
.mapwrap svg{width:100%;height:auto;display:block;border-radius:16px}
.mapwrap .route{transition:opacity .2s}
.mapwrap.dim .route{opacity:.12}.mapwrap.dim .route.on{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.chip i{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
a.chip.link{background:var(--pine-soft);border-color:transparent;color:var(--pine);font-weight:700;padding:4px 10px;font-size:13px}

/* flights */
.leg{padding:14px 0;border-bottom:1px solid var(--line)}
.leg .d{font-size:13px;color:var(--mute)}
.leg .g{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:2px}
.leg .code{font-family:var(--head);font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1}
.leg .t{font-size:14px;color:var(--mute)}
.leg .mid{font-size:12px;color:var(--mute);text-align:center;padding-bottom:4px;border-bottom:1px dashed var(--faint)}
.leg .r{text-align:right}
.leg .note{font-size:13px;color:var(--mute);margin-top:6px}

/* itinerary */
.days{display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:2px 20px 12px;scrollbar-width:none;position:sticky;top:0;background:var(--snow);z-index:3}
.days::-webkit-scrollbar{display:none}
.dc{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:54px;padding:6px 0;text-align:center;cursor:pointer}
.dc small{display:block;font-size:12px;color:var(--mute)}
.dc b{font-family:var(--head);font-size:19px;font-weight:700}
.dc.on{background:var(--ink);border-color:var(--ink);color:#fff}.dc.on small{color:#c4cfcd}
.dc.today{box-shadow:inset 0 -3px 0 var(--saffron)}
.dayhead h2{font-family:var(--head);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.dayhead .meta{font-size:14px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--pine-soft);color:var(--pine);margin-right:6px;vertical-align:2px}
.tag.busy{background:var(--chili-soft);color:var(--chili)}.tag.moderate{background:var(--saffron-soft);color:#8A5A06}
.minimap{margin:14px 0 6px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.tl{margin-top:14px}
.st{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.st .time{font-family:var(--head);font-weight:700;font-size:16px;color:var(--pine);padding-top:1px}
.st h3{font-size:16px;font-weight:700;line-height:1.35}
.st p{font-size:14px;color:var(--mute);margin-top:2px}
.st.opt .time{color:#8A5A06}
.st .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mv{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.mv span:first-child{text-align:center;color:var(--faint)}
.secth{font-family:var(--head);font-weight:700;font-size:17px;padding:16px 0 6px;border-bottom:1px solid var(--line)}

/* halal */
.hal{padding:12px 0;border-bottom:1px solid var(--line)}
.hal h3{font-size:16px;font-weight:700}
.hal p{font-size:14px;color:var(--mute);margin-top:2px}
.hal.none h3{color:#8A5A06}
.hal .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tip{background:var(--saffron-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:6px}

/* segmented */
.seg{display:flex;background:#E4EAE7;border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 rgba(24,40,45,.08)}

/* money */
.big{font-family:var(--head);font-weight:800;font-size:36px;letter-spacing:-.02em;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:none}
.kv b{white-space:nowrap}
.kv .cr{display:flex;align-items:center;gap:8px}
.bars{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.left{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--pine-soft)}
.left.neg{background:var(--chili-soft)}
.left b{font-family:var(--head);font-size:24px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;gap:8px;align-items:center;font-size:15px;margin-top:12px}
.ck input{width:18px;height:18px;accent-color:var(--pine)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.person{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.person button{border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1}
.bal{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.bal .pos{color:var(--pine);font-weight:700}.bal .neg{color:var(--chili);font-weight:700}
.settle{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.settle b{font-family:var(--head)}
.exp-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.exp-item h3{font-size:15px;font-weight:700}
.exp-item p{font-size:13px;color:var(--mute)}
.exp-item .amt{text-align:right;font-family:var(--head);font-weight:700}
.exp-item .amt small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--faint)}

/* packing */
.prog{display:flex;align-items:center;gap:14px}
.prog .pct{font-family:var(--head);font-weight:800;font-size:36px;line-height:1}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pine);transition:width .3s}
.cat h3{font-family:var(--head);font-size:17px;font-weight:700;margin:22px 0 4px;display:flex;justify-content:space-between}
.cat h3 span{font-family:var(--body);font-size:13px;font-weight:400;color:var(--mute)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #B7C3BF;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.cb.on{background:var(--pine);border-color:var(--pine)}
.cb.on:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .nm{flex:1;cursor:pointer;font-size:15px}
.item.done .nm{color:var(--faint);text-decoration:line-through}
.x{flex:none;border:none;background:none;color:var(--faint);font-size:20px;cursor:pointer;width:28px;height:28px;line-height:1}
.addline{display:flex;gap:8px;margin-top:12px}
.addline .inp{flex:1;min-width:0}
.addline select{width:auto;flex:none}

/* apps */
.appi{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.appi .lg{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--head);font-weight:800;color:#fff;font-size:17px}
.appi h3{font-size:16px;font-weight:700}.appi p{font-size:14px;color:var(--mute)}
.appi a{font-size:13px;font-weight:700;text-decoration:none}

/* buttons + forms */
.btn{border:none;background:var(--ink);color:#fff;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.btn.pine{background:var(--pine)}.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.wa{background:#1E9E57}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toolbar{display:flex;justify-content:flex-end;margin:0 0 6px}
.ebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
.ebtn.on{background:var(--saffron);border-color:var(--saffron);color:var(--ink)}
.ctl{display:flex;gap:4px;margin-top:8px}
.ctl button{border:1px solid var(--line);background:var(--snow);min-width:34px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--mute);padding:0 8px}
button.arm{background:var(--chili)!important;border-color:var(--chili)!important;color:#fff!important;font-weight:700}
.addbtn{border:1px dashed #AFC0B8;background:none;border-radius:12px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--pine);width:100%;margin-top:10px}
.addrow{display:flex;gap:6px}.addrow .addbtn{flex:1}
.linkb{border:none;background:none;color:var(--pine);font-weight:700;font-size:14px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
form.edit{background:var(--surface);border:2px solid var(--saffron);border-radius:16px;padding:14px;margin:10px 0}
form.edit .fl{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:6px 0 4px}
form.edit input,form.edit textarea,form.edit select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-size:15px}
form.edit textarea{resize:vertical}
form.edit .ck input{width:18px}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.err{color:var(--chili);font-size:14px;margin-top:8px;min-height:1em}
.empty{color:var(--mute);font-size:15px;padding:14px 0}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--faint);padding:6px 0;cursor:pointer;border-radius:10px}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--pine)}
nav.tabs button.on svg{stroke-width:2.3}

.ph{position:relative;margin:0;border-radius:18px;overflow:hidden;background:var(--glacier);aspect-ratio:16/10}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;z-index:2;right:0;bottom:0;max-width:100%;font-size:11px;line-height:1.3;padding:4px 8px;background:rgba(24,40,45,.62);color:#fff;border-top-left-radius:10px}
.ph figcaption a{color:#fff;text-decoration:none}
.ph.gone{display:none}
.hero{aspect-ratio:auto;height:min(52vw,280px);margin-bottom:14px;border-radius:22px}
.hero::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(16,30,34,.72));pointer-events:none}
.hero .ttl{z-index:1;position:absolute;left:16px;bottom:30px;right:16px;color:#fff;font-family:var(--head);font-weight:800;font-size:clamp(24px,6vw,34px);letter-spacing:-.02em;line-height:1.05;text-shadow:0 1px 14px rgba(0,0,0,.45)}
.hero .ttl small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;margin-top:4px}

.dayph{margin-top:14px;display:grid;gap:8px}
.dayph.two{grid-template-columns:1.4fr 1fr}.dayph.two .ph{aspect-ratio:auto;height:190px}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:20px;scrollbar-width:none;align-items:flex-start}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 62%;max-width:260px;border:0;padding:0;background:none;text-align:left;cursor:pointer;scroll-snap-align:start;font:inherit;color:inherit}
.strip .ph{aspect-ratio:4/3;border-radius:16px}
.strip .lb{display:block;margin-top:6px;font-size:14px}.strip .lb b{font-family:var(--head);font-weight:700;display:block;font-size:15px}
.strip button:focus-visible{outline:3px solid var(--saffron);outline-offset:3px;border-radius:16px}
.areaph{margin:6px 0 10px}.areaph .ph{aspect-ratio:21/9}
.credits li{margin:6px 0 0 18px;font-size:14px;color:var(--mute)}.credits a{color:var(--pine)}
@media (min-width:760px){.strip button{flex-basis:30%}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="when" id="hWhen"></div><h1 id="hName">Trip Chengdu</h1></div>
    <div class="lang" id="lang"><button data-l="ms" type="button">BM</button><button data-l="en" type="button">EN</button></div>
  </header>
  <div class="sync" id="sync"><i></i><span></span></div>

  <section class="view" id="v-home"></section>
  <section class="view" id="v-plan"><div class="days" id="days"></div><div id="dayBody"></div></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-money"></section>
  <section class="view" id="v-more"></section>
</div>
<template id="mapTpl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Atkinson Hyperlegible, DejaVu Sans, Noto Sans CJK SC, sans-serif">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#E6ECE9"/><stop offset=".55" stop-color="#F1F5F3"/><stop offset="1" stop-color="#EAF1EE"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity=".18"/></filter></defs>
<rect width="900" height="680" rx="22" fill="url(#bg)"/>
<path d="M0,0 H430 C400,120 380,220 330,300 C300,360 250,420 230,520 C215,600 200,640 190,680 H0Z" fill="#D9E2DE" opacity=".75"/>
<path d="M0,0 H260 C230,140 200,260 150,360 C120,430 90,560 70,680 H0Z" fill="#CBD7D1" opacity=".7"/>
<path d="M440,40 C430,120 420,200 438,321 C470,420 560,470 640,520 C700,560 760,600 860,640" fill="none" stroke="#A9CBE0" stroke-width="5" stroke-linecap="round" opacity=".8"/>

const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const b64enc=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const ghH=()=>({Accept:"application/vnd.github+json",...(token?{Authorization:"Bearer "+token}:{})});

  el.querySelector("span").textContent=s.startsWith("fail:")?t("saveFail",{e:s.slice(5)}):(map[s]||"");
  el.className="sync "+(s==="ok"||s==="saved"?"ok":s==="err"||s.startsWith("fail")?"bad":"")}
function gotData(d){lastSync=Date.now();store.set("sc-synced",lastSync);
  const changed=JSON.stringify(d)!==JSON.stringify(T);T=d;store.set("sc-data",T);
  if(changed&&!editing)renderAll();loadExp();setSync("ok")}
/* 1) GitHub API (freshest)  2) raw.githubusercontent.com  3) this site's data.json */
async function pull(){
  if(saving)return;
  if(token||Date.now()>apiBlockedUntil){
    try{
      const h=ghH();if(etag&&T)h["If-None-Match"]=etag;
      const r=await fetch(API+"?ref="+REPO.branch,{headers:h,cache:"no-store"});
      if(r.status===304){lastSync=Date.now();store.set("sc-synced",lastSync);setSync("ok");return}
      if(r.ok){const j=await r.json();etag=r.headers.get("ETag")||"";store.set("sc-etag",etag);if(!saving)gotData(JSON.parse(b64dec(j.content)));return}
      if(r.status===403||r.status===429){apiBlockedUntil=Date.now()+15*60000;store.set("sc-apiblock",apiBlockedUntil)}
    }catch(e){}
  }
  for(const u of [RAW+"?t="+Date.now(),"data.json?t="+Date.now()]){
    try{const r=await fetch(u,{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&d.days){if(!saving)gotData(d);return}}}catch(e){}
  }
  setSync(T?"err":"loading");
}
let commitQ=Promise.resolve();
function commit(mut,msg){
  mut(T);store.set("sc-data",T);renderAll();
  if(!token)return;
  saving++;setSync("saving");
  commitQ=commitQ.then(async()=>{
    for(let i=0;i<3;i++){
      const g=await fetch(API+"?ref="+REPO.branch+"&t="+Date.now(),{headers:ghH(),cache:"no-store"});
      if(!g.ok)throw new Error(g.status===401||g.status===403?"token":"HTTP "+g.status);
      const j=await g.json();const remote=JSON.parse(b64dec(j.content));mut(remote);
      const p=await fetch(API,{method:"PUT",headers:{...ghH(),"Content-Type":"application/json"},body:JSON.stringify({message:msg||"Update trip via app",content:b64enc(JSON.stringify(remote,null,2)+"\n"),sha:j.sha,branch:REPO.branch})});
      if(p.status===409||p.status===422)continue;
      if(!p.ok)throw new Error(p.status===401||p.status===403?"token":"HTTP "+p.status);
      etag="";store.set("sc-etag","");T=remote;store.set("sc-data",T);return;
    }
    throw new Error("conflict");
  }).then(()=>{saving--;lastSync=Date.now();setSync("saved");if(!editing)renderAll()},e=>{saving--;setSync("fail:"+e.message)});
}

function altSVG(){

  const days=T.days,n=days.length,W=340,H=150,top=34,bot=110,max=3600;
  const x=i=>18+i*(W-36)/Math.max(1,n-1),y=a=>bot-(Math.min(a||0,max)/max)*(bot-top);

  let path=`M${pts[0][0]},${bot} `+pts.map((p,i)=>{if(i===0)return`L${p[0]},${p[1]}`;const q=pts[i-1],mx=(q[0]+p[0])/2;return`C${mx},${q[1]} ${mx},${p[1]} ${p[0]},${p[1]}`}).join(" ")+` L${pts[n-1][0]},${bot} Z`;
  const line=path.replace(/^M[^L]+L/,"M").replace(/ L[\d.]+,[\d.]+ Z$/,"");
  const g=days.map((d,i)=>{const [px,py]=pts[i];const isT=d.date===today;const peak=(d.alt||0)>=2000;
    return `<g class="pt" data-day="${i}" tabindex="0" role="button" aria-label="${esc(t("day"))} ${i+1} ${esc(d.place||"")}">

      <circle cx="${px}" cy="${py}" r="${isT?7:5}" fill="${isT?"#E0A030":"#fff"}" stroke="#1F5E4B" stroke-width="2.5"/>
      <rect x="${px-20}" y="${py-20}" width="40" height="${bot-py+46}" fill="transparent"/>
      <text x="${px}" y="${bot+18}" text-anchor="middle" font-size="12" font-weight="700" fill="${isT?"#1F5E4B":"#18282D"}">${esc(fmt(d.date,{day:"numeric"}))}</text>
      <text x="${px}" y="${bot+33}" text-anchor="middle" font-size="10.5" fill="#5E6E70">${esc((d.place||"").slice(0,10))}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("altTitle"))}"><path d="${path}" fill="#D3E3E9"/><path d="${line}" fill="none" stroke="#1F5E4B" stroke-width="2.5" stroke-linecap="round"/>

function upNextHTML(){

  if(today<T.start){const f=T.flights[0];return f?`<div class="upnext"><div class="k">${esc(t("firstFlight"))} · ${esc(fmt(f.date,{weekday:"long",day:"numeric",month:"short"}))}</div><div class="v">${esc(f.from)} ${esc(f.fromT)} → ${esc(f.to)} ${esc(f.toT)}</div><div class="k">${esc(f.info)}</div></div>`:""}
  const d=T.days.find(x=>x.date===today);if(!d)return"";
  const now=new Date(),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const nx=d.stops.find(s=>s.kind==="stop"&&/^\d\d:\d\d/.test(s.t||"")&&s.t.slice(0,5)>=hm);
  return `<div class="upnext"><div class="k">${esc(t("upNext"))}</div><div class="v">${nx?esc(nx.t.slice(0,5)+"  "+tx(nx.h)):esc(t("nothingNext"))}</div></div>`;
}

  if(isEd(list,s.id))return listForm(list,s);

  if(s.kind==="move")return `<div class="mv"><span>↓</span><span>${esc(tx(s.h))}${c}</span></div>`;
  if(s.kind==="section")return `<div class="secth">${esc(tx(s.h))}${c}</div>`;
  const acts=[];if(s.map)acts.push(`<a class="chip link" href="${esc(mapUrl(s.map,s.city))}" target="_blank" rel="noopener">${esc(t("map"))}</a>`);

/* split maths: everything converted to RM */
function splitCalc(){
  const S=T.split||{rate:0.61,people:[],items:[]},P=S.people,bal={};P.forEach(p=>bal[p.id]=0);
  S.items.forEach(it=>{const amt=Number(it.amount||0)*(it.cur==="CNY"?Number(S.rate||0.61):1);const among=(it.among&&it.among.length?it.among:P.map(p=>p.id)).filter(id=>id in bal);if(!among.length||!(it.paidBy in bal))return;
    const share=amt/among.length;bal[it.paidBy]+=amt;among.forEach(id=>bal[id]-=share)});
  const cred=P.map(p=>({id:p.id,v:bal[p.id]})).filter(x=>x.v>0.009).sort((a,b)=>b.v-a.v),debt=P.map(p=>({id:p.id,v:-bal[p.id]})).filter(x=>x.v>0.009).sort((a,b)=>b.v-a.v);
  const tr=[];let i=0,j=0;while(i<debt.length&&j<cred.length){const v=Math.min(debt[i].v,cred[j].v);tr.push({from:debt[i].id,to:cred[j].id,v});debt[i].v-=v;cred[j].v-=v;if(debt[i].v<0.01)i++;if(cred[j].v<0.01)j++}
  return{bal,tr}}
const pname=id=>{const p=(T.split.people||[]).find(x=>x.id===id);return p?p.name:"?"};

  const {bal,tr}=splitCalc();

  h+=`<div class="who" style="margin-top:10px">${S.people.map(p=>`<span class="person">${esc(p.name)}${editMode?`<button type="button" data-rmp="${esc(p.id)}" aria-label="Remove">×</button>`:""}</span>`).join("")}</div>`;
  if(editMode&&!editing)h+=`<form class="addline" id="addPerson"><input class="inp" name="n" maxlength="30" placeholder="${esc(t("personPh"))}"><button class="btn ghost">${esc(t("addPerson"))}</button></form>`;
  h+=`<p class="small" style="margin-top:10px">${esc(t("rate",{r:rate}))}${editMode&&!editing?` · <button class="linkb" type="button" data-a="erate">${esc(t("edit"))}</button>`:""}</p>`;

  h+=`<div class="rows" style="margin-top:12px">${S.items.length?S.items.map(it=>isEd("bills",it.id)?listForm("bills",it):`<div class="exp-item"><div><h3>${esc(it.what||it.item)}</h3><p>${esc(t("paidBy",{p:pname(it.paidBy)}))}, ${esc(it.among&&it.among.length?t("forSome",{n:it.among.length}):t("forAll"))}${it.date?" · "+esc(fmt(it.date,{day:"numeric",month:"short"})):""}</p>${ctl("bills",it.id)}</div><div class="amt">${it.cur==="CNY"?"¥"+Number(it.amount).toLocaleString("en"):rm(it.amount)}${it.cur==="CNY"?`<small>≈ ${rm(it.amount*rate)}</small>`:""}</div></div>`).join(""):`<p class="empty">${esc(token?t("noItems"):t("viewOnlySplit"))}</p>`}</div>`;
  if(S.people.length)h+=addBtn("bills",t("addBill"));
  if(S.items.length){
    h+=`<h2 class="sec">${esc(t("balances"))}</h2><div class="rows">${S.people.map(p=>{const v=bal[p.id]||0;return `<div class="bal"><span>${esc(p.name)}</span><span class="${v>0.009?"pos":v<-0.009?"neg":""}">${v>0.009?"+":v<-0.009?"−":""}${rm(Math.abs(v))}</span></div>`}).join("")}</div>`;

  }
  return h;
}

  const s=e.target.closest("[data-m]");if(s){dropNew();editing=null;moneyTab=s.dataset.m;store.set("sc-mtab",moneyTab);renderMoney();return}
  const r=e.target.closest("[data-rmp]");if(r){const id=r.dataset.rmp;if(T.split.items.some(it=>it.paidBy===id||(it.among||[]).includes(id))){if(!r.dataset.arm){r.dataset.arm=1;r.textContent="?";return}}
    commit(d=>{d.split.people=d.split.people.filter(p=>p.id!==id);d.split.items.forEach(it=>{if(it.among)it.among=it.among.filter(x=>x!==id)})},"Remove person")}
});

/* Aiman's Google Sheet */
let exp=store.get("sc-exp",null),expState="",expAt=store.get("sc-exp-at",0),expUrlLoaded="";
const sheetId=u=>{const m=String(u||"").match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:""};
function parseCSV(txt){const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}return rows}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
function readTables(rows){const out=[];
  rows.forEach((r,ri)=>r.forEach((c,ci)=>{
    if(/^date$/i.test(c.trim())&&/^item$/i.test((r[ci+1]||"").trim())&&/^rm$/i.test((r[ci+2]||"").trim())){
      let title="";for(let k=ri-1;k>=0&&!title;k--){const a=rows[k];title=[a[ci],a[ci+1],a[ci+2]].map(x=>(x||"").trim()).filter(Boolean).join(" ")}
      const items=[];for(let k=ri+1;k<rows.length;k++){const x=rows[k];const dt=(x[ci]||"").trim(),it=(x[ci+1]||"").trim(),v=(x[ci+2]||"").trim();
        if(/^date$/i.test(dt))break;if(!dt&&!it&&!v)continue;if(/^(total|jumlah)/i.test(dt)||/^(total|jumlah)/i.test(it))continue;items.push({dt,it,rm:num(v)})}
      out.push({title,items})}}));return out}
async function loadExp(force){
  const u=T&&T.expenses&&T.expenses.url,id=sheetId(u);if(!id)return;
  if(!force&&expUrlLoaded===u&&Date.now()-expAt<60000)return;expUrlLoaded=u;
  try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&t=${Date.now()}`,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);const txt=await r.text();if(/^\s*</.test(txt))throw new Error("html");
    exp={url:u,tables:readTables(parseCSV(txt))};expAt=Date.now();store.set("sc-exp",exp);store.set("sc-exp-at",expAt);expState="ok"}
  catch(e){expState=exp?"stale":"fail"}
  if(view==="money"&&moneyTab==="record"&&!editing)renderMoney()}
function expHTML(){
  const E=T.expenses;if(!E||!E.url)return`<p class="empty">–</p>`;
  let h=`<h2 class="sec" style="margin-top:0">${esc(E.title||"Expenses Tracker")}</h2>${E.by?`<p class="sub">${esc(t("expBy",{by:E.by}))}</p>`:""}<div class="actions"><a class="btn ghost sm" href="${esc(E.url)}" target="_blank" rel="noopener">${esc(t("expOpen"))}</a></div>`;
  if(exp&&exp.url===E.url&&exp.tables.length){
    h+=exp.tables.map((tb,i)=>{const tot=tb.items.reduce((s,x)=>s+x.rm,0);return `<h2 class="sec">${esc(tb.title||t("expTable")+" "+(i+1))}</h2><div class="rows">${tb.items.length?tb.items.map(x=>`<div class="kv"><span><span class="small">${esc(x.dt)}</span> ${esc(x.it)}</span><b>${rm(x.rm)}</b></div>`).join(""):`<p class="empty">${esc(t("expEmpty"))}</p>`}<div class="kv"><span><b>${esc(t("expTotal"))}</b></span><b>${rm(tot)}</b></div></div>`}).join("");
    h+=`<p class="small" style="margin-top:12px">${esc(t("expUpdated",{t:ago(expAt)}))}</p>`}
  else h+=`<p class="empty">${esc(expState==="fail"?t("expFail"):t("expLoading"))}</p>`;
  return h}

/* ================= MORE: packing, apps, settings ================= */
const CATS=()=>Object.keys(T.packing);
const defBag=()=>{const a=[];CATS().forEach(c=>T.packing[c].forEach(([ms,en])=>a.push({id:uid(),c,n:{ms,en},d:false})));return a};
function getBag(){let b=store.get("sc-bag",null);if(!b){b=defBag();store.set("sc-bag",b)}return b}
function packHTML(){
  const bag=getBag(),done=bag.filter(i=>i.d).length,tot=bag.length,pct=tot?Math.round(done/tot*100):0;
  const left=bag.filter(i=>!i.d).map(i=>"• "+tx(i.n));
  const wa="https://wa.me/?text="+encodeURIComponent(`${t("waHead")} (${done}/${tot})\n\n${t("waLeft")}:\n${left.join("\n")||"-"}`);
  return `<div class="prog"><div class="pct">${pct}%</div><div style="flex:1"><div><b>${done}/${tot}</b> ${esc(t("packed"))}</div><div class="bar"><i style="width:${pct}%"></i></div></div></div><p class="small" style="margin-top:8px">${esc(t("packNote"))}</p>
   <div id="packCats">${CATS().filter(c=>bag.some(i=>i.c===c)).map(c=>{const it=bag.filter(i=>i.c===c);return `<div class="cat"><h3>${esc(t("bc_"+c))}<span>${it.filter(i=>i.d).length}/${it.length}</span></h3>${it.map(i=>`<div class="item${i.d?" done":""}" data-id="${i.id}"><span class="cb${i.d?" on":""}" data-p="tog" role="checkbox" aria-checked="${i.d}" tabindex="0"></span><span class="nm" data-p="tog">${esc(tx(i.n))}</span><button class="x" type="button" data-p="del" aria-label="Remove">×</button></div>`).join("")}</div>`}).join("")}</div>
   <form class="addline" id="addForm"><input class="inp" id="addName" maxlength="60" placeholder="${esc(t("phItem"))}"><select class="inp" id="addCat">${CATS().map(c=>`<option value="${c}">${esc(t("bc_"+c))}</option>`).join("")}</select><button class="btn">${esc(t("addItem"))}</button></form>
   <div class="actions"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">${esc(t("shareWa"))}</a><button class="btn ghost" type="button" id="resetBtn">${esc(t("reset"))}</button></div>`}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function appsHTML(){const cats=["hotels","food","maps","transport","essentials"];
  return `<div class="chips" style="padding-top:0">${cats.map(c=>`<button type="button" class="chip${c===appCat?" on":""}" data-ac="${c}">${esc(t("cat_"+c))}</button>`).join("")}</div><div class="rows" style="margin-top:8px">${T.apps.filter(a=>a.cat===appCat).map(a=>`<div class="appi"><div class="lg" style="background:hsl(${hue(a.name)} 35% 38%)">${esc(a.name[0])}</div><div><h3>${esc(a.name)}</h3><p>${esc(tx(a))}</p><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))}</a></div></div>`).join("")}</div>`}
function settingsHTML(){
  return `<h2 class="sec" style="margin-top:0">${esc(t("adminTitle"))}</h2>`+(token?`<p class="sub">${esc(t("adminOn"))}</p><div class="actions"><button class="btn ghost" type="button" id="tokOut">${esc(t("adminOut"))}</button></div>`
    :`<p class="sub">${esc(t("adminOff"))}</p><p class="small" style="margin-top:8px">${esc(t("adminSteps"))}</p><p style="margin-top:8px"><a class="linkb" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">${esc(t("makeToken"))}</a></p><form class="addline" id="tokForm"><input class="inp" id="tokIn" type="password" autocomplete="off" placeholder="${esc(t("tokenPh"))}"><button class="btn">${esc(t("tokenSave"))}</button></form><p class="err" id="tokErr"></p>`)+
   `<h2 class="sec">${esc(t("installTitle"))}</h2><p class="sub">${esc(t("installTxt"))}</p>
   <div class="actions"><button class="btn ghost" type="button" id="refreshBtn">${esc(t("refresh"))}</button></div>`+creditsHTML()}
function creditsHTML(){const ps=Object.values(T.photos||{}).filter(p=>p&&p.file);if(!ps.length)return"";
  return `<h2 class="sec">${esc(t("credits"))}</h2><p class="sub">${esc(t("creditsSub"))}</p><ul class="credits">${ps.map(p=>`<li><a href="${esc(imgPage(p.file))}" target="_blank" rel="noopener">${esc(tx(p.alt)||p.file)}</a>, ${esc(p.by)}, ${esc(p.lic)}</li>`).join("")}</ul>`}
function renderMore(){
  const tabs=[["pack","oPack"],["apps","oApps"],["set","oSet"]];
  $("#v-more").innerHTML=`<div class="seg" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" data-o="${k}" class="${moreTab===k?"on":""}" aria-selected="${moreTab===k}">${esc(t(l))}</button>`).join("")}</div>`+(moreTab==="pack"?packHTML():moreTab==="apps"?appsHTML():settingsHTML());
  const af=$("#addForm");if(af)af.onsubmit=e=>{e.preventDefault();const n=$("#addName").value.trim();if(!n)return;const b=getBag();b.push({id:uid(),c:$("#addCat").value,n,d:false});store.set("sc-bag",b);renderMore();$("#addName")&&$("#addName").focus()};
  const rb=$("#resetBtn");if(rb)rb.onclick=()=>{if(rb.dataset.arm){store.set("sc-bag",defBag());renderMore();return}rb.dataset.arm=1;rb.textContent=t("confirm");rb.classList.add("arm")};
  const tf=$("#tokForm");if(tf)tf.onsubmit=async e=>{e.preventDefault();const v=$("#tokIn").value.trim();if(!v)return;
    try{const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+v}});const j=r.ok?await r.json():null;
      if(j&&j.permissions&&j.permissions.push){token=v;store.set("sc-token",v);editMode=true;renderAll();pull()}else $("#tokErr").textContent=t("tokenBad")}catch(x){$("#tokErr").textContent=t("tokenBad")}};
  const to=$("#tokOut");if(to)to.onclick=()=>{token="";store.del("sc-token");editMode=false;editing=null;renderAll()};
  const rf=$("#refreshBtn");if(rf)rf.onclick=()=>{etag="";store.set("sc-etag","");apiBlockedUntil=0;store.set("sc-apiblock",0);setSync("syncing");pull();loadExp(true)};
}
$("#v-more").addEventListener("click",e=>{
  const o=e.target.closest("[data-o]");if(o){moreTab=o.dataset.o;store.set("sc-otab",moreTab);renderMore();return}
  const ac=e.target.closest("[data-ac]");if(ac){appCat=ac.dataset.ac;renderMore();return}
  const p=e.target.closest("[data-p]");if(p){const id=p.closest(".item").dataset.id;let b=getBag();if(p.dataset.p==="tog"){const i=b.find(x=>x.id===id);if(i)i.d=!i.d}else b=b.filter(x=>x.id!==id);store.set("sc-bag",b);renderMore()}
});
$("#v-more").addEventListener("keydown",e=>{const p=e.target.closest(".cb");if(p&&(e.key===" "||e.key==="Enter")){e.preventDefault();p.click()}});

/* ================= boot ================= */
function renderTop(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  $("#hName").textContent=tx(T.name);
  $("#hWhen").textContent=fmt(T.start,{day:"numeric",month:"short"})+" – "+fmt(T.end,{day:"numeric",month:"short",year:"numeric"});
}
function renderAll(){if(!T)return;renderTop();renderHome();renderDays();renderFood();renderMoney();renderMore();setSync(syncState)}
$("#lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;L=b.dataset.l;store.set("sc-lang",L);renderAll()};
document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
show(location.hash.slice(1));
if(T&&!T.halal){etag="";store.set("sc-etag","")}
if(T)renderAll();setSync(T?"syncing":"loading");
pull();loadExp();
setInterval(()=>{if(document.visibilityState==="visible"&&!editing){pull();loadExp()}},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
setInterval(()=>{if(syncState==="ok"||syncState==="err")setSync(syncState)},30000);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
